name: Laravel CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Construire l'image Laravel
        run: docker build -t laravel-app .

      - name: Verifier public/index.php
        run: >-
          docker run --rm
          -e APP_ENV=testing
          -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          -e DB_CONNECTION=sqlite
          -e DB_DATABASE=:memory:
          -e MAIL_MAILER=array
          application-laravel:${{ github.sha }}
          sh -c "touch .env && php artisan test --testsuite=${{ matrix.suite }}"
