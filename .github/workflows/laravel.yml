name: Tester Laravel

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        suite: [Unit, Feature]

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Construire l'image
        run: docker build -t application-laravel:${{ github.sha }} .

      - name: Executer les tests
        run: |
          docker run --rm \
            -e APP_ENV=testing \
            -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            -e DB_CONNECTION=sqlite \
            -e DB_DATABASE=:memory: \
            -e MAIL_MAILER=array \
            application-laravel:${{ github.sha }} \
            sh -c "touch .env && php artisan config:clear && php artisan test --testsuite=${{ matrix.suite }}"