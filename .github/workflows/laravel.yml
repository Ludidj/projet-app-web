
name: Tester Laravel

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        suite: [Unit, Feature]

    steps:
      # Récupérer le code
      - name: Recuperer le code
        uses: actions/checkout@v7

      # Construire l'image Docker
      - name: Construire l'image
        run: docker build -t application-laravel:${{ github.sha }} .

      # Exécuter les tests
      - name: Executer les tests
        run: >-
          docker run --rm
          -e APP_ENV=testing
          -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          -e DB_CONNECTION=sqlite
          -e DB_DATABASE=:memory:
          -e MAIL_MAILER=array
          application-laravel:${{ github.sha }}
          sh -c "touch .env && php artisan test --testsuite=${{ matrix.suite }}"
